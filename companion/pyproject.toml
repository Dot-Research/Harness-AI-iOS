[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-companion"
version = "0.1.0"
description = "A TLS-pinned, capability-restricted computer node for Harness"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
qr = ["segno==1.6.6"]

[project.scripts]
harness = "harness_companion.cli:main"

[tool.setuptools.packages.find]
include = ["harness_companion*"]
