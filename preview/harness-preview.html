function learningPage(){return `<h1 class="page-title">Learn together.<br>Keep the last word.</h1><p class="intro">A separate reviewer finds useful patterns. You decide what becomes part of your agent.</p><div class="card"><h3>Learning mode</h3><div class="segment">${['Off','Ask Me','Automatic'].map(v=>`<button data-mode="${v}" class="${state.learning===v?'active':''}" aria-pressed="${state.learning===v}">${v}</button>`).join('')}</div><p>${state.learning==='Ask Me'?'Every proposed change waits for your approval.':state.learning==='Off'?'New learning is paused. Your existing knowledge stays.':'Only eligible, explicit preferences may be saved automatically. Skills still need approval.'}</p></div><div class="eyebrow section-heading">WAITING FOR YOUR REVIEW <span>${state.proposal?'01':'00'}</span></div>${state.proposal?`<div class="card"><span class="pill">${icon('leaf')} USER.md UPDATE · SAMPLE</span><h2 style="margin-top:19px">Less, but more useful.</h2><p>Remember a preference for concise replies and clear next steps.</p><div class="eyebrow" style="margin-top:18px">EVIDENCE</div><p>Sample correction: “Please keep replies concise and end with clear next steps.”</p><div class="diff">+ Prefer concise replies with clear next steps.</div><div class="card-actions"><button class="primary" data-action="approve">Save preference</button><button class="secondary" data-action="edit-learning">Edit</button><button class="text-link" data-action="reject">Reject</button></div></div>`:`<div class="empty">${icon('leaf')}<h2>${state.saved?'A little more like you.':'All caught up.'}</h2><p>${state.saved?'Your preference is saved in the preview’s USER.md. You can revert it in Journey.':'New suggestions will appear here after meaningful conversations.'}</p></div>`}<button class="setting-row" data-page="journey">${icon('history')}<span><strong>See your Journey</strong><small>Every applied change stays visible</small></span><span class="chevron">›</span></button>`;}

 if(d.agent!==undefined){const a=agents[+d.agent];openSheet(a[0],`<span class="pill amber">SPECIALIST PROFILE</span><p>${a[1]}</p><div class="card"><h3>Permission profile</h3><p>Can read local context and relevant skills. No inherited permission to send messages, access your computer, or control your home.</p></div><label for="agent-context">AGENTS.md · example</label><textarea id="agent-context" readonly>Work within your assigned scope. Use relevant skills. Cite evidence, report uncertainty, and request approval for external actions.</textarea><p>Native delegation is available through a tool-capable endpoint.</p>`);return;}
 if(d.skill!==undefined||d.fork!==undefined){const i=+(d.skill??d.fork),s=skills[i],fork=d.fork!==undefined;openSheet(fork?`Fork ${s.name}`:s.name,`<p>${s.description}</p><div class="eyebrow section-heading">REQUESTED CAPABILITIES</div><div class="diff">${s.tools}\nNetwork: none</div><p>Installing saves the procedure disabled. It grants no native execution or device access.</p><label for="skill-procedure">SKILL.md ${fork?'· editable copy':''}</label><textarea id="skill-procedure" ${fork?'':'readonly'}>${esc(state.skillProcedures[i] || `# ${s.name}\n\n1. Clarify the goal and constraints.\n2. Read relevant context with permission.\n3. Offer a small, concrete plan.\n4. Ask what worked and propose useful learning.`)}</textarea><div class="card-actions"><button class="primary" data-install="${i}">${state.installed.includes(i)?'Already installed':fork?'Save fork in preview':'Install in preview'}</button></div>`);return;}
 if(d.install!==undefined){const i=+d.install;state.skillProcedures[i]=$('#skill-procedure').value;if(!state.installed.includes(i)){state.installed.push(i);state.journey.unshift({title:'Skill installed',text:`${skills[i].name} · disabled until enabled in the native app.`});}closeSheet();render();toast('Skill saved in preview · disabled by default');return;}
 if(d.like!==undefined){const i=+d.like;state.likes=state.likes.includes(i)?state.likes.filter(x=>x!==i):[...state.likes,i];const scroll=$('#content').scrollTop;render();$('#content').scrollTop=scroll;return;}
 if(d.comments!==undefined){openSheet('Community preview','<p>Comments shown in this design are sample counts. A public community service is planned; this preview does not post or retrieve comments.</p>');return;}
 if(d.share!==undefined){const s=skills[+d.share];openSheet('Share a method',`<p>Copy this sample description to share the idea. No public skill link exists yet.</p><label for="share-copy">Skill description</label><textarea id="share-copy" readonly>${s.name}\n${s.description}\nHarness · a local-first personal agent</textarea><p>Select and copy the text above.</p>`);return;}
 if(d.file){const f=d.file;openSheet(f,`<p>Editable preview context. Changes stay only in this browser tab’s memory.</p><label for="file-content">${f}</label><textarea id="file-content">${esc(state.files[f])}</textarea><div class="card-actions"><button class="primary" data-save-file="${f}">Save changes</button></div>`);return;}
 if(d.saveFile){state.files[d.saveFile]=$('#file-content').value;closeSheet();render();toast('Preview file saved');return;}
 if(d.revert!==undefined){if(state.files['USER.md']!==state.savedPreference){toast('USER.md changed since this approval. Edit the file to remove the preference.');return;}const j=state.journey[+d.revert];state.files['USER.md']=state.beforePreference||'# User preferences\n';state.saved=false;j.reverted=true;render();toast('Preference reverted in preview');return;}
 switch(d.action){
 case 'new':state.messages=[];state.draft='';render();toast('New preview conversation');break;
 case 'history':openSheet('Conversations',state.messages.length?`<button class="card card-click" data-close><h3>${esc(state.messages[0].text)}</h3><p>${state.messages.length} messages · Current preview conversation</p></button>`:'<div class="empty"><h2>A fresh start.</h2><p>Send a demo message to see this conversation here. Native conversations are saved on your iPhone.</p></div>');break;
 case 'approve':approve();break;
 case 'reject':state.proposal=false;render();toast('Sample proposal rejected');break;
 case 'edit-learning':openSheet('Make it sound like you.','<label for="preference">Proposed preference</label><textarea id="preference">Prefer concise replies with clear next steps.</textarea><div class="card-actions"><button class="primary" data-action="save-learning">Save preference</button></div>');break;
 case 'save-learning':{const value=$('#preference').value.trim();if(!value){toast('Add a preference before saving');break;}closeSheet();approve(value);break;}
 case 'rename':openSheet('Your director. Your name.',`<p>Its role remains General Orchestration Director.</p><label for="director-name">Name</label><input id="director-name" maxlength="24" value="${esc(state.name)}"><div class="card-actions"><button class="primary" data-action="save-name">Save name</button></div>`);break;
 case 'save-name':{const name=$('#director-name').value.trim();if(!name){toast('Enter a name');break;}state.name=name;closeSheet();render();toast('Director renamed in preview');break;}
 case 'cloud':openSheet('Optional, by design.',`<span class="pill amber">OPENROUTER</span><p>In the native app, enter your provider key and model ID under Me → Models & providers. Credentials are stored in Apple Keychain.</p><p>Then explicitly choose Balanced or Cloud preferred. Selected context may leave your device after authorization.</p><p>This preview has no API credential fields or network access.</p>`);break;
 case 'audit':openSheet('Preview privacy observations',`<span class="pill">${icon('shield')} DETERMINISTIC OBSERVATIONS</span><p>• No model or cloud calls are implemented.<br>• No analytics or remote scripts are loaded.<br>• Changes use in-memory JavaScript state.<br>• No API credentials are collected.<br>• Reloading clears the preview.</p><p>These observations describe this interface preview, not the native app or an independent security audit.</p>`);break;
 case 'pair':openSheet('One scan. Your computer.',`<span class="pill amber">NATIVE APP REQUIRED</span><p>1. Start the companion pairing command.<br>2. In Harness, open Me → Devices → Add Computer.<br>3. Scan the single-use QR code.<br>4. Grant filesystem or terminal access separately.</p><p>This preview does not open the camera or connect to a computer.</p>`);break;
 }
 if(button.id==='reset')location.reload();
});
render();

if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embedded');

</script>
</body>
</html>
