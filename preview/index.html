<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link id="harness-favicon" rel="icon" type="image/png" href="logo.png">
  <title>Harness — iOS interface preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="preview-header">
    <div class="wordmark"><img class="tiny-mark" data-harness-logo src="logo.png" alt="Harness horse painting, 馬到成功"> Harness <span class="preview-tag">Five spaces</span></div>
    <div class="device-switch" aria-label="Preview layout"><button data-device="phone">Compact</button><button data-device="duo" class="active">Expanded</button></div>
    <button class="reset-preview" id="reset">Reset preview</button>
  </header>
  <main class="stage">
    <div class="device duo" id="device">
      <div class="system-bar"><span>9:41</span><span class="system-right">▮▮▮ <span>◔</span><span class="battery"></span></span></div>
      <div class="app-shell">
        <aside class="context-panel" id="context" aria-label="Workspace"></aside>
        <div class="main-column">
          <header class="app-header" id="app-header"></header>
          <div class="content-scroll" id="content" tabindex="-1"></div>
          <div id="composer"></div>
        </div>
        <nav class="side-nav" aria-label="Main navigation"></nav>
      </div>
      <nav class="bottom-nav" aria-label="Main navigation"></nav>
      <div class="home-indicator"></div>
      <div class="modal-shade" id="modal-shade" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" id="sheet"></section></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </main>
  <footer class="preview-footer"><span class="preview-dot"></span> Interactive design preview <span>·</span> Local examples, saved in your browser <span>·</span> Adaptive layouts, not device-accurate simulation</footer>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
